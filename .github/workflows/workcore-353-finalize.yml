name: Finalize WorkCore issue 353 branch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: workcore-353-finalize
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/workcore-dynamic-pricing-353
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Merge latest main without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main

      - name: Download and verify minimal ownership correction
        shell: bash
        run: |
          set -euo pipefail
          correction="$RUNNER_TEMP/workcore-353-ownership-correction.tar.gz"
          curl --fail --location --retry 3 \
            'https://titan-create-phase-0-1.miniup.app/downloads/workcore-353-ownership-correction.tar.gz' \
            --output "$correction"
          echo 'dd8364b986ca96b22ca8b7b8d55af2247da880bdf422626d89d42b8e9eb9b65d  '"$correction" | sha256sum --check --strict
          test "$(tar -tzf "$correction")" = 'ownership-manifest.json'
          tar -xzf "$correction" -C app/extensions/WorkCore_Platform
          rm -f .github/workflows/workcore-353-finalize.yml

      - name: Verify pricing, integrity and complete package syntax
        working-directory: app/extensions/WorkCore_Platform
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests/test_workcore_dynamic_pricing.py tests/test_repository_integrity.py -v
          python tools/refresh_package_checksums.py --repo . --check
          python tools/validate_repository.py --repo .
          expected_php_files="$(python - <<'PY'
          import json
          from pathlib import Path
          print(sum(
              1
              for manifest_path in Path('packages').glob('*/files.sha256.json')
              for entry in json.loads(manifest_path.read_text(encoding='utf-8')).get('files', [])
              if isinstance(entry, dict) and entry.get('path', '').endswith('.php')
          ))
          PY
          )"
          actual_php_files="$(find packages -type f -name '*.php' | wc -l | tr -d ' ')"
          test "$actual_php_files" -eq "$expected_php_files"
          find packages -type f -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /tmp/workcore-353-final-php-lint.txt
          echo "Validated $actual_php_files WorkCore package PHP files."

      - name: Build and validate all six final installers
        working-directory: app/extensions/WorkCore_Platform
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_magicai_extensions.py --repo . --output "$RUNNER_TEMP/workcore-353-final-build"
          python tools/validate_magicai_extensions.py "$RUNNER_TEMP"/workcore-353-final-build/WorkCore*
          find "$RUNNER_TEMP/workcore-353-final-build" -type f -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /tmp/workcore-353-final-generated-lint.txt
          test -f "$RUNNER_TEMP/workcore-353-final-build/release-report.json"

      - name: Commit minimal manifest correction and push finalized branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          test ! -e .github/workflows/workcore-353-finalize.yml
          if ! git diff --cached --quiet; then
            git commit -m 'chore(workcore): finalize pricing ownership metadata'
          fi
          git push origin HEAD:feature/workcore-dynamic-pricing-353
