name: Layered Wizard Composer Temporary Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sqlite3
          coverage: none

      - name: Install isolated Illuminate dependencies
        run: |
          rm -rf /tmp/workcore-layered-wizard-test
          mkdir -p /tmp/workcore-layered-wizard-test
          cd /tmp/workcore-layered-wizard-test
          printf '%s\n' '{"require":{"php":"^8.2","illuminate/database":"^10.0","illuminate/events":"^10.0","illuminate/support":"^10.0","symfony/uid":"^6.0"}}' > composer.json
          composer install --no-interaction --no-progress --prefer-dist

      - name: Run focused layered wizard contract
        env:
          AI_EXTENSIONS_REPO_ROOT: ${{ github.workspace }}
          WORKCORE_TEST_VENDOR_AUTOLOAD: /tmp/workcore-layered-wizard-test/vendor/autoload.php
        run: php app/extensions/WorkCore_Platform/tests/layered_wizard_questions.php

      - name: Lint focused test
        if: always()
        run: php -l app/extensions/WorkCore_Platform/tests/layered_wizard_questions.php
