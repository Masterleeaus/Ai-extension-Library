name: Restore Titan Hub visible identity

on:
  push:
    branches:
      - issue/255-titan-hub-flutter-foundation
    paths:
      - .github/workflows/restore-titan-hub-visible-identity.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: issue/255-titan-hub-flutter-foundation

      - name: Restore full donor files and patch only display names
        run: |
          git show origin/main:'mobile apps/titan-hub/lib/language/english.dart' \
            > 'mobile apps/titan-hub/lib/language/english.dart'
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('mobile apps/titan-hub/lib/language/english.dart'): [
                  ('static String appName = "";', 'static String appName = "Titan Hub";'),
              ],
              Path('mobile apps/titan-hub/android/app/src/main/AndroidManifest.xml'): [
                  ('android:label="QRPay"', 'android:label="Titan Hub"'),
              ],
              Path('mobile apps/titan-hub/ios/Runner/Info.plist'): [
                  ('<string>QRPay</string>', '<string>Titan Hub</string>'),
                  ('<string>QRPAY</string>', '<string>Titan Hub</string>'),
              ],
          }

          for path, changes in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in changes:
                  if text.count(old) != 1:
                      raise SystemExit(
                          f'Expected one occurrence of {old!r} in {path}, found {text.count(old)}'
                      )
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/restore-titan-hub-visible-identity.yml

      - name: Commit focused identity patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            'mobile apps/titan-hub/lib/language/english.dart' \
            'mobile apps/titan-hub/android/app/src/main/AndroidManifest.xml' \
            'mobile apps/titan-hub/ios/Runner/Info.plist' \
            .github/workflows/restore-titan-hub-visible-identity.yml
          git commit -m "feat(titan-hub): apply visible platform identity"
          git push origin HEAD:issue/255-titan-hub-flutter-foundation
