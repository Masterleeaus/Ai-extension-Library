name: Patch Titan Hub donor importer

on:
  push:
    branches:
      - issue/445-materialise-titan-hub-donors
    paths:
      - .github/workflows/patch-titan-hub-importer.yml
      - scripts/patch_titan_hub_importer.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: issue/445-materialise-titan-hub-donors

      - name: Patch importer
        run: python scripts/patch_titan_hub_importer.py

      - name: Commit patched importer and remove temporary patch files
        run: |
          rm .github/workflows/patch-titan-hub-importer.yml
          rm scripts/patch_titan_hub_importer.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            .github/workflows/import-titan-hub-donors.yml \
            .github/workflows/patch-titan-hub-importer.yml \
            scripts/patch_titan_hub_importer.py
          git commit -m "ci: fix donor artifact redirect authentication"
          git push origin HEAD:issue/445-materialise-titan-hub-donors
