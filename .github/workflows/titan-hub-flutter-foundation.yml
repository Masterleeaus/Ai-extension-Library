name: Titan Hub Flutter Foundation

on:
  push:
    branches:
      - issue/255-titan-hub-flutter-foundation
    paths:
      - 'mobile apps/titan-hub/**'
      - '.github/workflows/titan-hub-flutter-foundation.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'mobile apps/titan-hub/**'
      - '.github/workflows/titan-hub-flutter-foundation.yml'

permissions:
  contents: read

concurrency:
  group: titan-hub-flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile apps/titan-hub
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Verify formatting of changed Dart files
        run: |
          mapfile -d '' files < <(
            git diff --name-only -z --diff-filter=ACMR origin/main...HEAD -- '*.dart' \
              | while IFS= read -r -d '' path; do
                  printf '%s\0' "${path#mobile apps/titan-hub/}"
                done
          )
          if ((${#files[@]} == 0)); then
            exit 0
          fi
          dart format "${files[@]}"
          git diff --exit-code -- "${files[@]}"
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
