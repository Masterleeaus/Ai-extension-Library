name: Titan Hub Flutter Foundation

on:
  push:
    branches:
      - issue/255-titan-hub-flutter-foundation
    paths:
      - 'mobile apps/titan-hub/**'
      - '.github/workflows/titan-hub-flutter-foundation.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'mobile apps/titan-hub/**'
      - '.github/workflows/titan-hub-flutter-foundation.yml'

permissions:
  contents: read

concurrency:
  group: titan-hub-flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile apps/titan-hub
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Verify formatting of changed Dart files
        run: |
          git diff --name-only --diff-filter=ACMR origin/main...HEAD -- '*.dart' \
            | sed 's#^mobile apps/titan-hub/##' \
            | tr '\n' '\0' \
            | xargs -0 -r dart format --output=none --set-exit-if-changed
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
