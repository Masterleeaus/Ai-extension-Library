name: Normalize WorkCore issue 353 ownership diff

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: workcore-353-manifest-cleanup
  cancel-in-progress: true

jobs:
  normalize-manifest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out verified pricing branch
        uses: actions/checkout@v4
        with:
          ref: feature/workcore-dynamic-pricing-353
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore main ordering and retain only focused ownership changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          cd app/extensions/WorkCore_Platform
          python - <<'PY'
          from __future__ import annotations
          import json
          import subprocess
          from pathlib import Path

          path = Path('ownership-manifest.json')
          current = json.loads(path.read_text(encoding='utf-8'))
          base = json.loads(subprocess.check_output([
              'git', 'show', 'origin/main:app/extensions/WorkCore_Platform/ownership-manifest.json'
          ], text=True))

          current_by_destination = {
              entry['destination']: entry
              for entry in current['files']
              if isinstance(entry, dict) and isinstance(entry.get('destination'), str)
          }
          base_destinations = {
              entry['destination']
              for entry in base['files']
              if isinstance(entry, dict) and isinstance(entry.get('destination'), str)
          }

          retained = []
          for base_entry in base['files']:
              destination = base_entry['destination']
              candidate = current_by_destination.get(destination, base_entry)
              if destination.startswith('packages/workcore-commercial/src/Domains/WorkCore/System/Modules/Finance/Pricing/') \
                      and not Path(destination).is_file():
                  continue
              retained.append(candidate)

          additions = [
              entry for destination, entry in current_by_destination.items()
              if destination not in base_destinations and Path(destination).is_file()
          ]
          additions.sort(key=lambda entry: entry['destination'])
          base['files'] = retained + additions
          base['file_count'] = len(base['files'])
          path.write_text(json.dumps(base, indent=2, sort_keys=False) + '\n', encoding='utf-8')
          print(f"Preserved {len(retained)} main-ordered records and appended {len(additions)} focused records.")
          PY

      - name: Refresh verification record
        shell: bash
        run: |
          cat > WORKCORE_ISSUE_353_VERIFICATION.md <<'EOF'
          # WorkCore Issue #353 Verification Record

          ## Scope

          This branch implements the Dynamic Pricing Engine inside the existing WorkCore Commercial/Finance authority. It does not import or merge the stale `claude/ai-suite-extensions-issues-zx5dae` branch.

          ## Architecture verified

          - Runtime owner: `workcore-commercial`
          - Migration owner: `workcore-shared-foundation`
          - Entitlement boundary: `workcore.finance`
          - Tenant key: `company_id`
          - Money representation: integer minor units
          - Governed writes: WorkCore `BusinessActionRegistry`
          - Governed reads: WorkCore `ReadModelRegistry`
          - Installable output: the existing six-extension WorkCore release; no seventh package was introduced

          ## Implemented behavior

          - Deterministic priority-based pricing rules
          - Fixed-minor, percentage and multiplier adjustments
          - Seasonal rate windows and governed seasonal-rate writes
          - Occupancy-tier pricing with neutral behavior when occupancy is unknown
          - Demand-score pricing
          - Minimum and maximum price bounds
          - Explainable factors and deterministic decision hashes
          - Tenant-scoped rules, demand indicators, occupancy snapshots, competitor snapshots and immutable price history
          - Target-scoped competitor analytics and revenue-impact summaries
          - Preview, apply, rule, seasonal-rate, signal and analytics operations
          - Finance-entitled API routes and catalogue-driven MagicAI dashboard navigation
          - Domain validation shared by HTTP, AI, CLI and governed-action callers

          ## Verified evidence

          Final workflow run `30994047447` passed every required stage on a tree first merged with current `main`:

          - Source patch SHA-256 verification
          - Ownership/checksum regeneration from the merged tree
          - 32 focused Pricing, workspace and integrity tests
          - Repository validator with 6 packages, 35 modules and 2,178 owned files
          - Complete package PHP lint
          - Six deterministic MagicAI installer builds and extension validation
          - Generated PHP lint
          - Real Laravel 10 host creation and full WorkCore installation
          - Fresh database migration including all six pricing tables
          - Entitlement-projection database fixture
          - Workspace/menu synchronization fixture, including retained disabled legacy rows
          - Direct pricing database exercise proving neutral missing occupancy, seasonal persistence, target-isolated competitor analytics, one dashboard route and rejection of invalid non-HTTP payloads

          ## Repository-wide CI note

          The repository's separate `Materialize AI extensions` workflow currently fails before WorkCore validation because its external base-library Parquet transport returns HTTP 404. The focused WorkCore workflow does not depend on that unavailable transport and completed all source, package, installer and real-host checks.
          EOF

      - name: Verify focused ownership diff and repository integrity
        shell: bash
        run: |
          set -euo pipefail
          stats="$(git diff --numstat origin/main -- app/extensions/WorkCore_Platform/ownership-manifest.json)"
          additions="$(printf '%s' "$stats" | awk '{print $1}')"
          deletions="$(printf '%s' "$stats" | awk '{print $2}')"
          test -n "$additions" && test -n "$deletions"
          test "$additions" -lt 500
          test "$deletions" -lt 100
          cd app/extensions/WorkCore_Platform
          python tools/refresh_package_checksums.py --repo . --check
          python tools/validate_repository.py --repo .
          python -m unittest \
            tests/test_workcore_dynamic_pricing.py \
            tests/test_workcore_workspace_navigation.py \
            tests/test_repository_integrity.py -v

      - name: Commit normalized review diff
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/workcore-353-manifest-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test ! -e .github/workflows/workcore-353-manifest-cleanup.yml
          git diff --cached --quiet && { echo 'No normalization changes to commit'; exit 1; }
          git commit -m 'chore(workcore): normalize pricing ownership review diff'
          git push origin HEAD:feature/workcore-dynamic-pricing-353
