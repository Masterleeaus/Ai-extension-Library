name: Wizard Answer Recomposition Final Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/wizard-answer-recomposition
          fetch-depth: 0

      - name: Merge current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Serialize answer revision updates
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/extensions/WorkCore_Platform/packages/workcore-business-network/src/Domains/WorkCore/System/Modules/Wizards/Repositories/EloquentWizardRepository.php')
          text = path.read_text(encoding='utf-8')
          old = "$row = $this->db->table('tz_wizard_runs')->where('company_id', $companyId)->where('public_id', $publicId)->first();"
          new = "$row = $this->db->table('tz_wizard_runs')->where('company_id', $companyId)->where('public_id', $publicId)->lockForUpdate()->first();"
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one run-row query to lock.')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sqlite3
          coverage: none

      - name: Install isolated Illuminate dependencies
        run: |
          rm -rf /tmp/workcore-recomposition-test
          mkdir -p /tmp/workcore-recomposition-test
          cd /tmp/workcore-recomposition-test
          printf '%s\n' '{"require":{"php":"^8.2","illuminate/database":"^10.0","illuminate/events":"^10.0","illuminate/support":"^10.0","symfony/uid":"^6.0"}}' > composer.json
          composer install --no-interaction --no-progress --prefer-dist

      - name: Generate canonical WorkCore integrity manifests
        working-directory: app/extensions/WorkCore_Platform
        run: |
          rm -rf /tmp/workcore-checksums
          python tools/refresh_package_checksums.py --repo . --output-dir /tmp/workcore-checksums
          cp /tmp/workcore-checksums/WorkCore.extension.manifest.json native-extensions/WorkCore/extension.manifest.json
          for generated in /tmp/workcore-checksums/*.files.sha256.json; do
            package="$(basename "$generated" .files.sha256.json)"
            cp "$generated" "packages/${package}/files.sha256.json"
          done

      - name: Run focused WorkCore wizard contracts
        env:
          AI_EXTENSIONS_REPO_ROOT: ${{ github.workspace }}
          WORKCORE_TEST_VENDOR_AUTOLOAD: /tmp/workcore-recomposition-test/vendor/autoload.php
        run: |
          php app/extensions/WorkCore_Platform/tests/wizard_answer_recomposition.php
          php app/extensions/WorkCore_Platform/tests/wizard_answer_recomposition_queue.php
          php app/extensions/WorkCore_Platform/tests/vertical_wizard_context.php

      - name: Run Interaction Engine proposal and regression suites
        run: |
          php packages/titan-interaction-engine/tests/vertical_context.php
          php packages/titan-interaction-engine/tests/vertical_ai_proposal.php
          php packages/titan-interaction-engine/tests/vertical_ai_proposal_security.php
          php packages/titan-interaction-engine/tests/run.php
          php packages/titan-interaction-engine/bin/verify.php

      - name: Run complete WorkCore Platform contract suite
        working-directory: app/extensions/WorkCore_Platform
        run: python -m unittest discover tests -p 'test_*.py' -v

      - name: Lint recomposition implementation
        run: |
          php -l app/extensions/WorkCore_Platform/tests/wizard_answer_recomposition.php
          php -l app/extensions/WorkCore_Platform/tests/wizard_answer_recomposition_queue.php
          php -l app/extensions/WorkCore_Platform/packages/workcore-business-network/src/Domains/WorkCore/System/Modules/Wizards/Actions/SaveWizardAnswer.php
          php -l app/extensions/WorkCore_Platform/packages/workcore-business-network/src/Domains/WorkCore/System/Modules/Wizards/Providers/WorkWizardsServiceProvider.php
          php -l app/extensions/WorkCore_Platform/packages/workcore-business-network/src/Domains/WorkCore/System/Modules/Wizards/Repositories/EloquentWizardRepository.php
          php -l app/extensions/WorkCore_Platform/packages/workcore-business-network/src/Domains/WorkCore/System/Modules/Wizards/Services/WizardRuntime.php
          find app/extensions/WorkCore_Platform/packages/workcore-business-network/src/Domains/WorkCore/System/Modules/Wizards \
            \( -name '*Recomposition*.php' -o -name '*Enrichment*.php' -o -name 'WizardAnswerChanged.php' -o -name 'WizardDependencyResolver.php' \) \
            -print0 | xargs -0 -r -n1 php -l
          grep -q 'dispatchAfterResponse' app/extensions/WorkCore_Platform/packages/workcore-business-network/src/Domains/WorkCore/System/Modules/Wizards/Services/LaravelWizardAIEnrichmentDispatcher.php
          grep -q 'lockForUpdate' app/extensions/WorkCore_Platform/packages/workcore-business-network/src/Domains/WorkCore/System/Modules/Wizards/Repositories/EloquentWizardRepository.php

      - name: Remove temporary workflow and publish verified head
        run: |
          rm -f .github/workflows/wizard-recomposition-diagnostic-temp.yml
          git add -A
          git commit -m "feat(wizards): finalize answer-driven recomposition [skip ci]"
          files="$(git diff --name-only origin/main...HEAD | sort)"
          printf '%s\n' "$files"
          ! printf '%s\n' "$files" | grep -q '^\.github/workflows/'
          ! printf '%s\n' "$files" | grep -q '^docs/temporary-'
          while IFS= read -r file; do
            case "$file" in
              app/extensions/WorkCore_Platform/packages/workcore-business-network/*) ;;
              app/extensions/WorkCore_Platform/packages/*/files.sha256.json) ;;
              app/extensions/WorkCore_Platform/native-extensions/WorkCore/extension.manifest.json) ;;
              app/extensions/WorkCore_Platform/tests/wizard_answer_recomposition.php) ;;
              app/extensions/WorkCore_Platform/tests/wizard_answer_recomposition_queue.php) ;;
              *) echo "Unexpected final file: $file"; exit 1 ;;
            esac
          done <<< "$files"
          for required in \
            app/extensions/WorkCore_Platform/packages/workcore-business-network/src/Domains/WorkCore/System/Modules/Wizards/Actions/SaveWizardAnswer.php \
            app/extensions/WorkCore_Platform/packages/workcore-business-network/src/Domains/WorkCore/System/Modules/Wizards/Events/WizardAnswerChanged.php \
            app/extensions/WorkCore_Platform/packages/workcore-business-network/src/Domains/WorkCore/System/Modules/Wizards/Jobs/EnrichWizardAnswerProposal.php \
            app/extensions/WorkCore_Platform/packages/workcore-business-network/src/Domains/WorkCore/System/Modules/Wizards/Repositories/DatabaseWizardRecompositionRepository.php \
            app/extensions/WorkCore_Platform/packages/workcore-business-network/src/Domains/WorkCore/System/Modules/Wizards/Services/WizardAnswerRecompositionService.php \
            app/extensions/WorkCore_Platform/tests/wizard_answer_recomposition.php; do
            printf '%s\n' "$files" | grep -qx "$required"
          done
          git push origin HEAD:feature/wizard-answer-recomposition
