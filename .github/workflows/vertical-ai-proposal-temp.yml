name: Vertical AI Proposal Final Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/vertical-ai-proposal-bridge
          fetch-depth: 0

      - name: Merge current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Validate package metadata
        run: composer validate --no-check-publish --strict packages/titan-interaction-engine/composer.json

      - name: Run focused vertical AI proposal contracts
        run: |
          php packages/titan-interaction-engine/tests/vertical_ai_proposal.php
          php packages/titan-interaction-engine/tests/vertical_ai_proposal_security.php

      - name: Run Interaction Engine regression suites
        run: |
          php packages/titan-interaction-engine/tests/vertical_context.php
          php packages/titan-interaction-engine/tests/run.php
          php packages/titan-interaction-engine/bin/verify.php

      - name: Lint proposal implementation
        run: |
          php -l packages/titan-interaction-engine/tests/vertical_ai_proposal.php
          php -l packages/titan-interaction-engine/tests/vertical_ai_proposal_security.php
          find packages/titan-interaction-engine/src/Vertical/AI -name '*.php' -print0 | xargs -0 -r -n1 php -l

      - name: Remove temporary workflow and publish verified head
        run: |
          rm -f .github/workflows/vertical-ai-proposal-temp.yml
          git add -A
          git commit -m "feat(vertical-ai): finalize provider-neutral proposal bridge [skip ci]"
          files="$(git diff --name-only origin/main...HEAD | sort)"
          printf '%s\n' "$files"
          test "$(printf '%s\n' "$files" | grep -c '^')" -eq 10
          ! printf '%s\n' "$files" | grep -q '^\.github/workflows/'
          ! printf '%s\n' "$files" | grep -q '^docs/temporary-'
          git push origin HEAD:feature/vertical-ai-proposal-bridge
