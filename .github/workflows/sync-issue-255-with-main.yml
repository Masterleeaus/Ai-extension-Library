name: Sync Issue 255 with main

on:
  push:
    branches:
      - issue/255-titan-hub-flutter-foundation
    paths:
      - .github/workflows/sync-issue-255-with-main.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: issue/255-titan-hub-flutter-foundation

      - name: Merge current main without discarding concurrent work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff --no-edit origin/main
          rm .github/workflows/sync-issue-255-with-main.yml
          git add -A -- .github/workflows/sync-issue-255-with-main.yml
          git commit --amend --no-edit
          git push origin HEAD:issue/255-titan-hub-flutter-foundation
