name: Register Titan showcase once

on:
  push:
    branches:
      - issue/256-titan-native-design-system
    paths:
      - '.github/workflows/register-titan-showcase.yml'

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: issue/256-titan-native-design-system

      - name: Register internal route and self-remove
        run: |
          python <<'PY'
          from pathlib import Path

          routes = Path('mobile apps/titan-hub/lib/routes/routes.dart')
          route_text = routes.read_text()
          route_marker = "  static const String bottomNavBarScreen = '/bottomNavBarScreen';\n"
          route_addition = "  static const String designSystemShowcase = '/design-system';\n"
          if route_text.count(route_marker) != 1:
              raise SystemExit('Expected one bottom navigation route declaration')
          route_text = route_text.replace(
              route_marker,
              route_marker + route_addition,
              1,
          )
          routes.write_text(route_text)

          pages = Path('mobile apps/titan-hub/lib/routes/route_pages.dart')
          page_text = pages.read_text()
          import_marker = "import 'package:qrpay/backend/services/api_endpoint.dart';\n"
          showcase_import = "import 'package:qrpay/features/design_system/titan_design_system_showcase.dart';\n"
          if page_text.count(import_marker) != 1:
              raise SystemExit('Expected one API endpoint import')
          page_text = page_text.replace(
              import_marker,
              import_marker + showcase_import,
              1,
          )

          page_marker = "      binding: InitialScreenBindings(),\n    ),\n    GetPage(\n      name: Routes.dashboardScreen,"
          showcase_page = "      binding: InitialScreenBindings(),\n    ),\n    GetPage(\n      name: Routes.designSystemShowcase,\n      page: () => const TitanDesignSystemShowcase(),\n    ),\n    GetPage(\n      name: Routes.dashboardScreen,"
          if page_text.count(page_marker) != 1:
              raise SystemExit('Expected one dashboard route after bottom navigation')
          pages.write_text(page_text.replace(page_marker, showcase_page, 1))
          PY
          rm .github/workflows/register-titan-showcase.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            'mobile apps/titan-hub/lib/routes/routes.dart' \
            'mobile apps/titan-hub/lib/routes/route_pages.dart' \
            .github/workflows/register-titan-showcase.yml
          git commit -m "feat(titan-hub): register internal design system route"
          git push origin HEAD:issue/256-titan-native-design-system
