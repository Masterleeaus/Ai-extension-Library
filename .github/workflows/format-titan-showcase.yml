name: Format Titan showcase once

on:
  push:
    branches:
      - issue/256-titan-native-design-system
    paths:
      - '.github/workflows/format-titan-showcase.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: issue/256-titan-native-design-system

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      - name: Apply exact Dart formatting and self-remove
        run: |
          dart format 'mobile apps/titan-hub/lib/features/design_system/titan_design_system_showcase.dart'
          rm .github/workflows/format-titan-showcase.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            'mobile apps/titan-hub/lib/features/design_system/titan_design_system_showcase.dart' \
            .github/workflows/format-titan-showcase.yml
          git commit -m "style(titan-hub): format design system showcase"
          git push origin HEAD:issue/256-titan-native-design-system
