name: Materialize AI extensions

on:
  push:
    branches:
      - main
      - agent/import-ai-extensions
      - agent/replace-core-ai-extensions-pass3
    paths:
      - .github/workflows/materialize-ai-extensions.yml
      - scripts/restore_extensions.py
      - scripts/apply_ecommerce_overlay.py
      - scripts/package_titanai_hybrid.py
      - scripts/tests/test_package_titanai_hybrid.py
      - transport/dataset-manifest.json
      - transport/pass3-overlay-manifest.json
      - transport/ecommerce-overlay-manifest.json
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-ai-extensions-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  restore-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Install Parquet reader
        run: python -m pip install --disable-pip-version-check pyarrow
      - name: Restore base library and apply verified Pass 3 overlay
        run: |
          DATASET_URL=$(python -c "import json; print(json.load(open('transport/dataset-manifest.json'))['url'])")
          python scripts/restore_extensions.py \
            --clean \
            --url "$DATASET_URL" \
            --overlay-manifest transport/pass3-overlay-manifest.json
      - name: Convert TitanAI foundation to Composer package
        run: python scripts/package_titanai_hybrid.py --root .
      - name: Apply verified ChatbotEcommerce overlay
        run: |
          python scripts/apply_ecommerce_overlay.py \
            --root . \
            --manifest transport/ecommerce-overlay-manifest.json
      - name: Validate manifests and PHP syntax
        run: |
          python -m json.tool extensions/AIAgent/extension.json >/dev/null
          python -m json.tool extensions/AIChatPro/extension.json >/dev/null
          python -m json.tool extensions/Chatbot/extension.json >/dev/null
          python -m json.tool extensions/ChatbotEcommerce/extension.json >/dev/null
          python -m json.tool packages/titanai-hybrid-core/composer.json >/dev/null
          python -m json.tool extensions/AIAgent/titanai-package.json >/dev/null
          python -m json.tool extensions/AIChatPro/titanai-package.json >/dev/null
          python -m json.tool extensions/Chatbot/titanai-package.json >/dev/null
          find extensions/AIAgent extensions/AIChatPro extensions/Chatbot extensions/ChatbotEcommerce packages/titanai-hybrid-core/src \
            -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          echo "PHP linted $(wc -l </tmp/php-lint.log) files"
      - name: Verify TitanAI Composer package conversion
        run: |
          python -m unittest scripts.tests.test_package_titanai_hybrid -v
          python scripts/package_titanai_hybrid.py --root . --check
          php packages/titanai-hybrid-core/bin/verify-package.php
          test ! -e foundation/TitanAI-Hybrid
      - name: Run packaged ChatbotEcommerce verification
        run: |
          test "$(python -c "import json; print(json.load(open('extensions/ChatbotEcommerce/extension.json'))['version'])")" = "4.9.0"
          count=0
          for script in extensions/ChatbotEcommerce/tests/run_*.php; do
            php "$script"
            count=$((count + 1))
          done
          test "$count" -eq 38
          echo "ChatbotEcommerce verification scripts passed: $count"
      - name: Write materialisation summary
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          files = [path for path in Path('extensions').rglob('*') if path.is_file()]
          size = sum(path.stat().st_size for path in files)
          core = json.load(open('transport/pass3-overlay-manifest.json'))
          ecommerce = json.load(open('transport/ecommerce-overlay-manifest.json'))
          Path('MATERIALIZED.md').write_text(
              '# Materialised source tree\n\n'
              f'Files: **{len(files):,}**  \n'
              f'Bytes: **{size:,}**  \n'
              'Base source: MiniUp lossless Parquet transport dataset.  \n'
              f"Core overlay: **{core['source_bundle']}**  \n"
              f"Core overlay SHA-256: `{core['archive_sha256']}`  \n"
              'Composer package: **titanai/hybrid-core 1.0.0**  \n'
              'Package path: `packages/titanai-hybrid-core/`  \n'
              f"Ecommerce overlay: **{ecommerce['source_bundle']}**  \n"
              f"Ecommerce version: **{ecommerce['extension_version']}**  \n"
              f"Ecommerce overlay SHA-256: `{ecommerce['archive_sha256']}`  \n",
              encoding='utf-8',
          )
          PY
      - name: Commit materialised source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extensions packages scripts MATERIALIZED.md docs/extension-inventory.csv docs/extension-inventory.json
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Materialize verified core and ecommerce overlays"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
