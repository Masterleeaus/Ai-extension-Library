name: Apply verified WorkCore issue 353 patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: workcore-353-apply
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/workcore-dynamic-pricing-353
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Download and verify exact local patch
        shell: bash
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/workcore-353-patch.tar.gz"
          listing="$RUNNER_TEMP/workcore-353-patch-files.txt"
          curl --fail --location --retry 3 \
            'https://titan-create-phase-0-1.miniup.app/downloads/workcore-353-patch.tar.gz' \
            --output "$patch"
          echo '446ff7006c1227fd39eeafbe0d015580cb92b34b9b87a09e5b36af657d8a4451  '"$patch" | sha256sum --check --strict
          tar -tzf "$patch" > "$listing"
          grep -Fxq 'packages/workcore-commercial/src/Domains/WorkCore/System/Modules/Finance/Pricing/Domain/DynamicPriceCalculator.php' "$listing"
          grep -Fxq 'packages/workcore-shared-foundation/src/Domains/WorkCore/Database/Migrations/2026_08_05_180000_create_workcore_dynamic_pricing_tables.php' "$listing"

      - name: Apply patch to canonical WorkCore platform
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/workcore-353-patch.tar.gz" \
            -C app/extensions/WorkCore_Platform
          rm -f \
            .github/workflows/workcore-353-source-export.yml \
            .github/workflows/workcore-353-apply-patch.yml

      - name: Verify focused pricing and repository integrity
        working-directory: app/extensions/WorkCore_Platform
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests/test_workcore_dynamic_pricing.py tests/test_repository_integrity.py -v
          python tools/refresh_package_checksums.py --repo . --check
          python tools/validate_repository.py --repo .

      - name: Lint complete package PHP inventory
        working-directory: app/extensions/WorkCore_Platform
        shell: bash
        run: |
          set -euo pipefail
          expected_php_files="$(python - <<'PY'
          import json
          from pathlib import Path
          print(sum(
              1
              for manifest_path in Path('packages').glob('*/files.sha256.json')
              for entry in json.loads(manifest_path.read_text(encoding='utf-8')).get('files', [])
              if isinstance(entry, dict) and entry.get('path', '').endswith('.php')
          ))
          PY
          )"
          actual_php_files="$(find packages -type f -name '*.php' | wc -l | tr -d ' ')"
          test "$actual_php_files" -eq "$expected_php_files"
          find packages -type f -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /tmp/workcore-353-php-lint.txt
          echo "Linted $actual_php_files WorkCore package PHP files."

      - name: Build and validate all six MagicAI installers
        working-directory: app/extensions/WorkCore_Platform
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_magicai_extensions.py --repo . --output "$RUNNER_TEMP/workcore-353-build"
          python tools/validate_magicai_extensions.py "$RUNNER_TEMP"/workcore-353-build/WorkCore*
          find "$RUNNER_TEMP/workcore-353-build" -type f -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /tmp/workcore-353-generated-php-lint.txt
          test -f "$RUNNER_TEMP/workcore-353-build/release-report.json"

      - name: Commit verified focused implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test ! -e .github/workflows/workcore-353-source-export.yml
          test ! -e .github/workflows/workcore-353-apply-patch.yml
          git diff --cached --quiet && { echo 'No patch changes to commit'; exit 1; }
          git commit -m 'feat(workcore): add tenant-safe dynamic pricing engine (#353)'
          git push origin HEAD:feature/workcore-dynamic-pricing-353
