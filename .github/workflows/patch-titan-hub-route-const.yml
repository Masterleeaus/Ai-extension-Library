name: Patch Titan Hub route constness

on:
  push:
    branches:
      - issue/255-titan-hub-flutter-foundation
    paths:
      - .github/workflows/patch-titan-hub-route-const.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: issue/255-titan-hub-flutter-foundation

      - name: Apply focused route fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('mobile apps/titan-hub/lib/routes/route_pages.dart')
          text = path.read_text(encoding='utf-8')
          old = 'page: () => BottomNavBarScreen(),'
          new = 'page: () => const BottomNavBarScreen(),'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one route constructor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/patch-titan-hub-route-const.yml

      - name: Commit focused fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            'mobile apps/titan-hub/lib/routes/route_pages.dart' \
            .github/workflows/patch-titan-hub-route-const.yml
          git commit -m "fix(titan-hub): use const shell route"
          git push origin HEAD:issue/255-titan-hub-flutter-foundation
