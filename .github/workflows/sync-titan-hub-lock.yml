name: Sync Titan Hub dependency lock

on:
  push:
    branches:
      - issue/255-titan-hub-flutter-foundation
    paths:
      - .github/workflows/sync-titan-hub-lock.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: issue/255-titan-hub-flutter-foundation

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        working-directory: mobile apps/titan-hub
        run: flutter pub get

      - name: Commit lockfile and remove temporary workflow
        run: |
          rm .github/workflows/sync-titan-hub-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            'mobile apps/titan-hub/pubspec.lock' \
            .github/workflows/sync-titan-hub-lock.yml
          git commit -m "build(titan-hub): lock secure storage dependencies"
          git push origin HEAD:issue/255-titan-hub-flutter-foundation
