name: Titan Vertical Context Composer Temporary Verification

on:
  push:
    branches:
      - feature/titan-vertical-context-composer
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Validate package metadata
        working-directory: packages/titan-interaction-engine
        run: composer validate --no-check-publish

      - name: Run focused vertical context tests
        working-directory: packages/titan-interaction-engine
        run: php tests/vertical_context.php

      - name: Run interaction engine tests
        working-directory: packages/titan-interaction-engine
        run: php tests/run.php

      - name: Run interaction engine verifier
        working-directory: packages/titan-interaction-engine
        run: php bin/verify.php

      - name: Lint vertical context source
        working-directory: packages/titan-interaction-engine
        run: find src/Vertical -name '*.php' -print0 | xargs -0 -n1 php -l
