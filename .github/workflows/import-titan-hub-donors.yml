name: Import sanitised Titan Hub donors

on:
  push:
    branches:
      - issue/445-materialise-titan-hub-donors
    paths:
      - .github/workflows/import-titan-hub-donors.yml
      - transport/titan-hub-import/**

permissions:
  contents: write
  actions: write

concurrency:
  group: titan-hub-donor-import
  cancel-in-progress: false

jobs:
  materialise:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: issue/445-materialise-titan-hub-donors

      - name: Select secure import phase
        id: phase
        shell: bash
        run: |
          if [[ -f transport/titan-hub-import/wrapped-key.b64 ]]; then
            echo "mode=materialise" >> "$GITHUB_OUTPUT"
          elif [[ -f transport/titan-hub-import/public.pem ]]; then
            echo "mode=waiting" >> "$GITHUB_OUTPUT"
          else
            echo "mode=bootstrap" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate ephemeral import keypair
        if: steps.phase.outputs.mode == 'bootstrap'
        run: |
          mkdir -p transport/titan-hub-import
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/titan-hub-import-private.pem
          openssl pkey -in /tmp/titan-hub-import-private.pem -pubout -out transport/titan-hub-import/public.pem

      - name: Preserve ephemeral private key
        if: steps.phase.outputs.mode == 'bootstrap'
        uses: actions/upload-artifact@v4
        with:
          name: titan-hub-import-private-key
          path: /tmp/titan-hub-import-private.pem
          retention-days: 1
          if-no-files-found: error

      - name: Publish public wrapping key
        if: steps.phase.outputs.mode == 'bootstrap'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transport/titan-hub-import/public.pem
          git commit -m "ci: publish ephemeral donor import public key"
          git push origin HEAD:issue/445-materialise-titan-hub-donors

      - name: Await wrapped transport key
        if: steps.phase.outputs.mode == 'waiting'
        run: echo "Public key is ready; waiting for the locally wrapped transport key."

      - uses: actions/setup-python@v5
        if: steps.phase.outputs.mode == 'materialise'
        with:
          python-version: '3.12'

      - uses: shivammathur/setup-php@v2
        if: steps.phase.outputs.mode == 'materialise'
        with:
          php-version: '8.3'
          coverage: none

      - name: Install transport readers
        if: steps.phase.outputs.mode == 'materialise'
        run: python -m pip install --disable-pip-version-check pyarrow cryptography

      - name: Recover ephemeral private key
        if: steps.phase.outputs.mode == 'materialise'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.request
          import zipfile
          from pathlib import Path

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'titan-hub-donor-import/1.0',
          }
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/actions/artifacts?name=titan-hub-import-private-key&per_page=100',
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              artifacts = json.load(response).get('artifacts', [])
          artifacts = [item for item in artifacts if not item.get('expired')]
          if not artifacts:
              raise SystemExit('No unexpired private-key artifact is available')
          artifact = max(artifacts, key=lambda item: item['created_at'])
          download = urllib.request.Request(artifact['archive_download_url'], headers=headers)
          archive = Path('/tmp/titan-hub-import-private.zip')
          with urllib.request.urlopen(download, timeout=120) as response, archive.open('wb') as output:
              output.write(response.read())
          with zipfile.ZipFile(archive) as bundle:
              names = bundle.namelist()
              if names != ['titan-hub-import-private.pem']:
                  raise SystemExit(f'Unexpected private-key artifact contents: {names}')
              bundle.extract('titan-hub-import-private.pem', '/tmp')
          Path('/tmp/titan-hub-import-artifact-id').write_text(str(artifact['id']), encoding='utf-8')
          PY

      - name: Unwrap transport key
        if: steps.phase.outputs.mode == 'materialise'
        run: |
          base64 -d transport/titan-hub-import/wrapped-key.b64 > /tmp/titan-hub-import-key.enc
          openssl pkeyutl -decrypt \
            -inkey /tmp/titan-hub-import-private.pem \
            -in /tmp/titan-hub-import-key.enc \
            -out /tmp/titan-hub-import-aes.key \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          test "$(wc -c < /tmp/titan-hub-import-aes.key)" -eq 32

      - name: Verify, decrypt and extract approved source
        if: steps.phase.outputs.mode == 'materialise'
        env:
          DATASET_URL: https://titan-hub-donor-transport.miniup.app/api/data-file/titan-hub-donor-transport/titan-hub-donor-ciphertext.geoparquet
          EXPECTED_CIPHERTEXT_SHA256: 7b7bdc437f76af4de47401f1126c18ca64c657711dccddc8982014c6f0088527
          EXPECTED_CIPHERTEXT_BYTES: '54103048'
          EXPECTED_PLAINTEXT_SHA256: 62a5ba7361de74294f47b5b720b24b6270fce5a047c56dfd0b686ced1c0a1b0f
          EXPECTED_PLAINTEXT_BYTES: '54103032'
          EXPECTED_NONCE_B64: YYcLe1CmBQBUzr0A
          EXPECTED_CHUNKS: '104'
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import os
          import shutil
          import tarfile
          import tempfile
          import urllib.request
          from pathlib import Path, PurePosixPath

          import pyarrow.parquet as pq
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          root = Path('.').resolve()
          request = urllib.request.Request(
              os.environ['DATASET_URL'],
              headers={'User-Agent': 'titan-hub-donor-import/1.0'},
          )
          with tempfile.TemporaryDirectory(prefix='titan-hub-donor-') as temp_name:
              temp = Path(temp_name)
              dataset = temp / 'transport.geoparquet'
              with urllib.request.urlopen(request, timeout=300) as response, dataset.open('wb') as output:
                  shutil.copyfileobj(response, output, length=1024 * 1024)

              columns = [
                  'Sequence', 'Payload_Base64', 'Total_Chunks',
                  'Ciphertext_Sha256', 'Ciphertext_Bytes',
                  'Plaintext_Sha256', 'Plaintext_Bytes',
                  'Nonce_Base64', 'Algorithm', 'AAD',
              ]
              data = pq.read_table(dataset, columns=columns).to_pydict()
              rows = sorted(zip(*(data[column] for column in columns)), key=lambda row: int(row[0]))
              expected_chunks = int(os.environ['EXPECTED_CHUNKS'])
              if [int(row[0]) for row in rows] != list(range(expected_chunks)):
                  raise SystemExit('Transport chunks are not contiguous')
              metadata = [
                  ({int(row[index]) for row in rows} if index in {2, 4, 6} else {str(row[index]) for row in rows})
                  for index in range(2, 10)
              ]
              if any(len(values) != 1 for values in metadata):
                  raise SystemExit('Transport metadata differs between chunks')
              if metadata[0] != {expected_chunks} or metadata[6] != {'AES-256-GCM'} or metadata[7] != {'titan-hub-issue-254'}:
                  raise SystemExit('Unexpected transport metadata')

              ciphertext = b''.join(base64.b64decode(str(row[1]), validate=True) for row in rows)
              if len(ciphertext) != int(os.environ['EXPECTED_CIPHERTEXT_BYTES']):
                  raise SystemExit('Ciphertext byte count mismatch')
              if hashlib.sha256(ciphertext).hexdigest() != os.environ['EXPECTED_CIPHERTEXT_SHA256']:
                  raise SystemExit('Ciphertext SHA-256 mismatch')

              key = Path('/tmp/titan-hub-import-aes.key').read_bytes()
              nonce = base64.b64decode(os.environ['EXPECTED_NONCE_B64'], validate=True)
              plaintext = AESGCM(key).decrypt(nonce, ciphertext, b'titan-hub-issue-254')
              if len(plaintext) != int(os.environ['EXPECTED_PLAINTEXT_BYTES']):
                  raise SystemExit('Plaintext byte count mismatch')
              if hashlib.sha256(plaintext).hexdigest() != os.environ['EXPECTED_PLAINTEXT_SHA256']:
                  raise SystemExit('Plaintext SHA-256 mismatch')

              targets = [
                  root / 'mobile apps' / 'titan-hub',
                  root / 'mobile apps' / 'mobilekit-reference',
                  root / 'integrations' / 'qrpay-web',
              ]
              for target in targets:
                  if target.exists():
                      shutil.rmtree(target)

              approved = (
                  PurePosixPath('mobile apps/titan-hub'),
                  PurePosixPath('mobile apps/mobilekit-reference'),
                  PurePosixPath('integrations/qrpay-web'),
                  PurePosixPath('docs/titan-hub'),
              )
              with tarfile.open(fileobj=io.BytesIO(plaintext), mode='r:gz') as archive:
                  members = []
                  for member in archive.getmembers():
                      path = PurePosixPath(member.name)
                      if not path.parts or str(path) in {'.', ''}:
                          continue
                      if path.is_absolute() or '..' in path.parts:
                          raise SystemExit(f'Unsafe archive path: {member.name!r}')
                      if member.issym() or member.islnk() or member.isdev():
                          raise SystemExit(f'Unsupported archive member: {member.name!r}')
                      if not any(path == prefix or prefix in path.parents for prefix in approved):
                          raise SystemExit(f'Archive path outside approved targets: {member.name!r}')
                      members.append(member)
                  archive.extractall(root, members=members, filter='data')
          print('Encrypted donor transport verified and extracted')
          PY

      - name: Verify source completeness and security
        if: steps.phase.outputs.mode == 'materialise'
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          required = [
              Path('mobile apps/titan-hub/pubspec.yaml'),
              Path('mobile apps/titan-hub/lib/main.dart'),
              Path('integrations/qrpay-web/composer.json'),
              Path('integrations/qrpay-web/artisan'),
              Path('integrations/qrpay-web/routes/web.php'),
              Path('integrations/qrpay-web/database/migrations'),
              Path('mobile apps/mobilekit-reference/HTML/index.html'),
              Path('docs/titan-hub/DONOR_MANIFEST.md'),
              Path('docs/titan-hub/DONOR_SECURITY_SCAN.md'),
              Path('docs/titan-hub/DONOR_SECURITY_SCAN.json'),
          ]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              raise SystemExit('Missing imported donor paths: ' + ', '.join(missing))

          targets = [
              Path('mobile apps/titan-hub'),
              Path('integrations/qrpay-web'),
              Path('mobile apps/mobilekit-reference'),
          ]
          forbidden_names = {
              '.env', 'key.properties', 'key.jks', 'google-services.json',
              'GoogleService-Info.plist', 'oauth-private.key', 'oauth-public.key',
          }
          forbidden_suffixes = {
              '.jks', '.keystore', '.p12', '.pfx', '.p8', '.pem',
              '.mobileprovision', '.provisionprofile',
          }
          forbidden_dirs = {
              '__MACOSX', '.dart_tool', '.gradle', 'node_modules', 'vendor',
              '.idea', '.vscode', 'DerivedData',
          }
          forbidden = []
          for source_root in targets:
              for path in source_root.rglob('*'):
                  if path.is_dir() and path.name in forbidden_dirs:
                      forbidden.append(str(path))
                  if path.is_file() and (
                      path.name in forbidden_names
                      or path.suffix.lower() in forbidden_suffixes
                      or (path.name.startswith('.env') and path.name != '.env.example')
                  ):
                      forbidden.append(str(path))
          if forbidden:
              raise SystemExit('Forbidden imported files/directories: ' + ', '.join(forbidden[:30]))

          patterns = {
              'private_key': re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              'google_api_key': re.compile(r'AIza[0-9A-Za-z_-]{30,}'),
              'aws_access_key': re.compile(r'AKIA[0-9A-Z]{16}'),
              'gateway_secret': re.compile(r'\b(?:sk_live|sk_test|sk-proj)-?[A-Za-z0-9_-]{16,}'),
              'jwt': re.compile(r'\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'),
              'flutterwave_key': re.compile(r'FLW(?:SEC|PUB)K[_A-Za-z0-9-]{12,}'),
          }
          binary_suffixes = {
              '.png', '.jpg', '.jpeg', '.gif', '.webp', '.ico', '.pdf',
              '.zip', '.gz', '.xz', '.ttf', '.woff', '.woff2', '.eot',
              '.mp4', '.mov', '.sketch', '.lock',
          }
          findings = []
          for source_root in targets:
              for path in source_root.rglob('*'):
                  if not path.is_file() or path.suffix.lower() in binary_suffixes or path.stat().st_size > 3_000_000:
                      continue
                  text = path.read_text(encoding='utf-8', errors='ignore')
                  for name, pattern in patterns.items():
                      match = pattern.search(text)
                      if match:
                          line = text.count('\n', 0, match.start()) + 1
                          findings.append(f'{name}: {path}:{line}')
          if findings:
              raise SystemExit('Credential-pattern findings: ' + ', '.join(findings[:30]))

          files = [path for source_root in targets for path in source_root.rglob('*') if path.is_file()]
          oversized = [str(path) for path in files if path.stat().st_size > 95 * 1024 * 1024]
          if oversized:
              raise SystemExit('Imported file exceeds 95 MiB: ' + ', '.join(oversized))
          if len(files) < 2700:
              raise SystemExit(f'Imported donor tree is unexpectedly small: {len(files)} files')
          report = json.loads(Path('docs/titan-hub/DONOR_SECURITY_SCAN.json').read_text(encoding='utf-8'))
          if report['scan']['credential_findings']:
              raise SystemExit('Committed security report contains unresolved credential findings')
          print(f'Verified {len(files)} imported donor files')
          PY

      - name: PHP lint QRPay Laravel donor
        if: steps.phase.outputs.mode == 'materialise'
        run: |
          find 'integrations/qrpay-web' -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l > /tmp/qrpay-php-lint.log
          echo "PHP linted $(wc -l < /tmp/qrpay-php-lint.log) donor files"

      - name: Commit materialised source and remove transport files
        if: steps.phase.outputs.mode == 'materialise'
        run: |
          rm .github/workflows/import-titan-hub-donors.yml
          rm -rf transport/titan-hub-import
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            'mobile apps/titan-hub' \
            'mobile apps/mobilekit-reference' \
            'integrations/qrpay-web' \
            docs/titan-hub/DONOR_MANIFEST.md \
            docs/titan-hub/DONOR_SECURITY_SCAN.md \
            docs/titan-hub/DONOR_SECURITY_SCAN.json \
            .github/workflows/import-titan-hub-donors.yml \
            transport/titan-hub-import
          git commit -m "Issue #445: import sanitised Titan Hub donor sources"
          git push origin HEAD:issue/445-materialise-titan-hub-donors

      - name: Delete private-key artifact
        if: steps.phase.outputs.mode == 'materialise' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT_ID="$(cat /tmp/titan-hub-import-artifact-id)"
          curl --fail --silent --show-error \
            -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
