name: Migration Engine Canonical Mapping

on:
  pull_request:
    paths:
      - 'app/extensions/Migration/**'
      - '.github/workflows/migration-engine-canonical-mapping.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Run issue 380 canonical mapping contract
        run: php app/extensions/Migration/tests/MigrationCanonicalMappingContractTest.php
      - name: Lint Migration extension PHP
        shell: bash
        run: |
          set -euo pipefail
          find app/extensions/Migration -type f -name '*.php' -print0 | xargs -0 -n1 php -l
