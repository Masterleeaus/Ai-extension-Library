name: Inspect Titan Hub donor import

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read latest importer push run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'titan-hub-donor-import-inspector/1.0',
          }
          url = (
              f'https://api.github.com/repos/{repository}/actions/workflows/'
              'import-titan-hub-donors.yml/runs?branch=issue%2F445-materialise-titan-hub-donors&event=push&per_page=5'
          )
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=60) as response:
              runs = json.load(response).get('workflow_runs', [])
          if not runs:
              raise SystemExit('No importer push run was found')
          run = runs[0]
          print(json.dumps({
              'id': run['id'],
              'status': run['status'],
              'conclusion': run['conclusion'],
              'head_sha': run['head_sha'],
              'created_at': run['created_at'],
              'updated_at': run['updated_at'],
              'html_url': run['html_url'],
          }, indent=2))
          with urllib.request.urlopen(urllib.request.Request(run['jobs_url'], headers=headers), timeout=60) as response:
              jobs = json.load(response).get('jobs', [])
          for job in jobs:
              print(f"job={job['name']} status={job['status']} conclusion={job['conclusion']}")
              for step in job.get('steps', []):
                  print(f"  step={step['number']} {step['name']} status={step['status']} conclusion={step['conclusion']}")
          if run['status'] != 'completed':
              raise SystemExit('Importer is still running')
          if run['conclusion'] != 'success':
              raise SystemExit(f"Importer concluded {run['conclusion']}")
          PY
