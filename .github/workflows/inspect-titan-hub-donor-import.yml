name: Inspect Titan Hub donor import

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read latest secure-import push runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'titan-hub-donor-import-inspector/1.1',
          }
          failures = []
          for workflow in ('patch-titan-hub-importer.yml', 'import-titan-hub-donors.yml'):
              url = (
                  f'https://api.github.com/repos/{repository}/actions/workflows/{workflow}/runs'
                  '?branch=issue%2F445-materialise-titan-hub-donors&event=push&per_page=5'
              )
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=60) as response:
                      runs = json.load(response).get('workflow_runs', [])
              except urllib.error.HTTPError as error:
                  print(f'workflow={workflow} HTTP {error.code}')
                  failures.append(f'{workflow}: unavailable')
                  continue
              if not runs:
                  print(f'workflow={workflow} no runs found')
                  failures.append(f'{workflow}: no run')
                  continue
              run = runs[0]
              print(json.dumps({
                  'workflow': workflow,
                  'id': run['id'],
                  'status': run['status'],
                  'conclusion': run['conclusion'],
                  'head_sha': run['head_sha'],
                  'created_at': run['created_at'],
                  'updated_at': run['updated_at'],
                  'html_url': run['html_url'],
              }, indent=2))
              with urllib.request.urlopen(urllib.request.Request(run['jobs_url'], headers=headers), timeout=60) as response:
                  jobs = json.load(response).get('jobs', [])
              for job in jobs:
                  print(f"job={job['name']} status={job['status']} conclusion={job['conclusion']}")
                  for step in job.get('steps', []):
                      print(f"  step={step['number']} {step['name']} status={step['status']} conclusion={step['conclusion']}")
              if workflow == 'patch-titan-hub-importer.yml' and run['conclusion'] not in {'success', None}:
                  failures.append(f'{workflow}: {run["conclusion"]}')
              if workflow == 'import-titan-hub-donors.yml' and run['status'] == 'completed' and run['conclusion'] != 'success':
                  failures.append(f'{workflow}: {run["conclusion"]}')
          if failures:
              raise SystemExit('; '.join(failures))
          PY
