name: Vertical AI Proposal Boundary Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vertical-ai-proposal-bridge
          fetch-depth: 0

      - name: Persist AI service and provider boundary report
        shell: bash
        run: |
          set -euo pipefail
          report="docs/temporary-vertical-ai-boundary-report.txt"
          mkdir -p "$(dirname "$report")"
          : > "$report"

          {
            echo '===== AI SERVICE MATCHES ====='
            grep -RIl --exclude-dir=.git --exclude='*.map' -E 'AIServiceInterface|interface[[:space:]]+AIService|class[[:space:]].*AI.*Provider|ProviderRegistry|ModelProvider' app packages foundation 2>/dev/null | sort | head -120 || true

            echo
            echo '===== LIKELY CONTRACT SOURCES ====='
            while IFS= read -r file; do
              echo "--- ${file} ---"
              sed -n '1,260p' "$file"
            done < <(
              grep -RIl --exclude-dir=.git --exclude='*.map' -E 'AIServiceInterface|interface[[:space:]]+AIService' app packages foundation 2>/dev/null | sort | head -20
            )

            echo
            echo '===== PROVIDER SELECTION SOURCES ====='
            while IFS= read -r file; do
              echo "--- ${file} ---"
              sed -n '1,220p' "$file"
            done < <(
              grep -RIl --exclude-dir=.git --exclude='*.map' -E 'ProviderRegistry|provider.*model|model.*provider|default_provider|ai_provider' app packages foundation 2>/dev/null | sort | grep -E '\.(php|json)$' | head -25
            )

            echo
            echo '===== STRUCTURED OUTPUT PATTERNS ====='
            grep -RIn --exclude-dir=.git --exclude='*.map' -E 'JSON_THROW_ON_ERROR|json_schema|response_format|structured.*output|schema.*validation' app packages foundation 2>/dev/null | head -160 || true
          } >> "$report"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$report"
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist AI boundary diagnostic [skip ci]"
            git push origin HEAD:feature/vertical-ai-proposal-bridge
          fi
