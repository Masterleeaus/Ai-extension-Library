name: Vertical Preview Planner Temporary Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/vertical-preview-planner-temp.yml'
      - 'packages/titan-interaction-engine/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run focused vertical preview planner contract
        run: php packages/titan-interaction-engine/tests/vertical_preview_planner.php

      - name: Lint focused test
        if: always()
        run: php -l packages/titan-interaction-engine/tests/vertical_preview_planner.php
