name: Titan Create security contracts

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/titan-create-security.yml
      - app/Services/Security/RemoteImageFetcher.php
      - app/extensions/CreativeSuite/System/Http/Controllers/CreativeSuiteDocumentController.php
      - app/extensions/CreativeSuite/System/Http/Controllers/CreativeSuiteAIController.php
      - app/extensions/AdvancedImage/System/Http/Controllers/AdvancedImageStatusController.php
      - app/extensions/AdvancedImage/System/Http/Controllers/AdvancedImageWebhookController.php
      - app/extensions/AdvancedImage/System/Services/AdvancedFreepikService.php
      - app/extensions/AdvancedImage/System/Services/Traits/HasDownloadImage.php
      - app/extensions/Canvas/System/Http/Controllers/CanvasController.php
      - tests/contracts/creative_suite_document_ownership.php
      - tests/contracts/creative_suite_ai_task_ownership.php
      - tests/contracts/advanced_image_task_ownership.php
      - tests/contracts/advanced_image_webhook_signature.php
      - tests/contracts/remote_image_fetcher_security.php
      - tests/contracts/canvas_message_ownership.php
      - tests/Feature/Extensions/CreativeSuite/CreativeSuiteDocumentOwnershipTest.php
      - tests/Feature/Extensions/CreativeSuite/CreativeSuiteAITaskOwnershipTest.php
      - tests/Feature/Extensions/AdvancedImage/AdvancedImageTaskOwnershipTest.php
      - tests/Feature/Extensions/AdvancedImage/AdvancedImageWebhookSignatureTest.php
      - tests/Feature/Extensions/Canvas/CanvasMessageOwnershipTest.php
      - tests/Unit/Security/RemoteImageFetcherTest.php
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: titan-create-security-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  titan-create-ownership-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Titan Create security PHP syntax
        run: |
          php -l app/Services/Security/RemoteImageFetcher.php
          php -l app/extensions/CreativeSuite/System/Http/Controllers/CreativeSuiteDocumentController.php
          php -l app/extensions/CreativeSuite/System/Http/Controllers/CreativeSuiteAIController.php
          php -l app/extensions/AdvancedImage/System/Http/Controllers/AdvancedImageStatusController.php
          php -l app/extensions/AdvancedImage/System/Http/Controllers/AdvancedImageWebhookController.php
          php -l app/extensions/AdvancedImage/System/Services/AdvancedFreepikService.php
          php -l app/extensions/AdvancedImage/System/Services/Traits/HasDownloadImage.php
          php -l app/extensions/Canvas/System/Http/Controllers/CanvasController.php
          php -l tests/contracts/creative_suite_document_ownership.php
          php -l tests/contracts/creative_suite_ai_task_ownership.php
          php -l tests/contracts/advanced_image_task_ownership.php
          php -l tests/contracts/advanced_image_webhook_signature.php
          php -l tests/contracts/remote_image_fetcher_security.php
          php -l tests/contracts/canvas_message_ownership.php
          php -l tests/Feature/Extensions/CreativeSuite/CreativeSuiteDocumentOwnershipTest.php
          php -l tests/Feature/Extensions/CreativeSuite/CreativeSuiteAITaskOwnershipTest.php
          php -l tests/Feature/Extensions/AdvancedImage/AdvancedImageTaskOwnershipTest.php
          php -l tests/Feature/Extensions/AdvancedImage/AdvancedImageWebhookSignatureTest.php
          php -l tests/Feature/Extensions/Canvas/CanvasMessageOwnershipTest.php
          php -l tests/Unit/Security/RemoteImageFetcherTest.php
      - name: Run Titan Create ownership contracts
        run: |
          php tests/contracts/creative_suite_document_ownership.php
          php tests/contracts/creative_suite_ai_task_ownership.php
          php tests/contracts/advanced_image_task_ownership.php
          php tests/contracts/advanced_image_webhook_signature.php
          php tests/contracts/remote_image_fetcher_security.php
          php tests/contracts/canvas_message_ownership.php
