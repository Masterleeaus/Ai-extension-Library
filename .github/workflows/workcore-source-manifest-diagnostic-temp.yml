name: WorkCore Source Manifest Diagnostic Temporary

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/workcore-wizard-vertical-context

      - name: Inspect test and contract symlinks
        working-directory: app/extensions/WorkCore_Platform
        shell: bash
        run: |
          set -euo pipefail
          echo '===== TEST DIRECTORY ====='
          ls -la tests | grep -E 'contract|manifest|repository|^l' || true
          echo '===== TEST SYMLINKS ====='
          find tests -maxdepth 2 -type l -printf '%p -> %l\n' | sort
          echo '===== CONTRACT SYMLINKS ====='
          find . -path './.git' -prune -o -type l -printf '%p -> %l\n' | grep -E 'contract|manifest|source|test' | sort || true
          echo '===== RESOLVED CONTRACT TEST ====='
          if [ -e tests/test_contract_source_manifest.py ] || [ -L tests/test_contract_source_manifest.py ]; then
            readlink -f tests/test_contract_source_manifest.py || true
            sed -n '1,260p' tests/test_contract_source_manifest.py
          fi
          echo '===== RESOLVED SOURCE MANIFESTS ====='
          find -L . -type f -name 'source-files.json' -print | while read -r file; do
            echo "--- ${file} ---"
            readlink -f "$file" || true
            sed -n '1,180p' "$file"
          done
