name: WorkCore Source Manifest Diagnostic Temporary

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/workcore-wizard-vertical-context

      - name: Introspect manifest contract source
        working-directory: app/extensions/WorkCore_Platform
        run: |
          rm -rf /tmp/workcore-source-manifest-diagnostics
          mkdir -p /tmp/workcore-source-manifest-diagnostics
          python - <<'PY'
          import importlib
          import inspect
          import shutil
          import sys
          from pathlib import Path

          tests = Path('tests').resolve()
          sys.path.insert(0, str(tests))
          module = importlib.import_module('test_contract_source_manifest')
          source_path = Path(module.__file__).resolve()
          print('MODULE_FILE', source_path)
          print(source_path.read_text(encoding='utf-8'))
          target = Path('/tmp/workcore-source-manifest-diagnostics/tests') / source_path.name
          target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(source_path, target)

          for candidate in Path('.').rglob('*'):
              if not candidate.is_file():
                  continue
              name = candidate.name.lower()
              if ('source' in name and 'manifest' in name) or name == 'source-files.json':
                  print('CANDIDATE', candidate)
                  output = Path('/tmp/workcore-source-manifest-diagnostics/repository') / candidate
                  output.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(candidate, output)
          PY
          find /tmp/workcore-source-manifest-diagnostics -type f -print

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: workcore-source-manifest-diagnostics
          path: /tmp/workcore-source-manifest-diagnostics
          if-no-files-found: error
          retention-days: 1
