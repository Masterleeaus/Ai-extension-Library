name: WorkCore Source Manifest Diagnostic Temporary

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/workcore-wizard-vertical-context

      - name: Discover retained test module authorities
        working-directory: app/extensions/WorkCore_Platform
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/workcore-checksum-diagnostic
          python tools/refresh_package_checksums.py --repo . --output-dir /tmp/workcore-checksum-diagnostic

          python - <<'PY'
          import inspect
          import sys
          import unittest
          from pathlib import Path

          def flatten(suite):
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      yield from flatten(item)
                  else:
                      yield item

          suite = unittest.TestLoader().discover('tests', pattern='test_*.py')
          seen = set()
          for case in flatten(suite):
              cls = case.__class__
              module_name = cls.__module__
              key = (module_name, cls.__name__)
              if key in seen:
                  continue
              seen.add(key)
              module = sys.modules.get(module_name)
              module_file = getattr(module, '__file__', None)
              source_file = inspect.getsourcefile(cls)
              print('TEST_CLASS', module_name, cls.__name__)
              print('  module_file=', module_file)
              print('  source_file=', source_file)
              if module_name == 'test_contract_source_manifest':
                  print('===== CONTRACT MODULE DICT KEYS =====')
                  print(sorted(k for k in vars(module) if not k.startswith('__')))
                  if source_file and Path(source_file).exists():
                      print('===== CONTRACT TEST SOURCE =====')
                      print(Path(source_file).read_text(encoding='utf-8'))

          print('===== GREP DYNAMIC LOADERS =====')
          for root in ('tests', 'tools'):
              for path in Path(root).rglob('*.py'):
                  text = path.read_text(encoding='utf-8', errors='replace')
                  if any(token in text for token in ('load_tests', 'exec(', 'compile(', 'zipfile', 'importlib', 'source-files.json', 'test_contract_source_manifest')):
                      print(path)
                      for number, line in enumerate(text.splitlines(), 1):
                          if any(token in line for token in ('load_tests', 'exec(', 'compile(', 'zipfile', 'importlib', 'source-files.json', 'test_contract_source_manifest')):
                              print(f'  {number}: {line}')
          PY

          echo '===== FILES AFTER DISCOVERY ====='
          find tests -maxdepth 1 -type f -printf '%f\n' | sort | grep -E 'contract|manifest|repository' || true
          find . -type f -name 'source-files.json' -print || true
          git status --short
