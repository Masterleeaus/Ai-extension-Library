name: WorkCore Source Manifest Diagnostic Temporary

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/workcore-wizard-vertical-context

      - name: Trace contract materialization stage
        shell: bash
        run: |
          set -euo pipefail

          probe() {
            stage="$1"
            echo "===== PROBE: ${stage} ====="
            find app/extensions/WorkCore_Platform/tests -maxdepth 1 -type f -printf '%f\n' 2>/dev/null | sort | grep -E 'contract|manifest|repository' || true
            find app/extensions/WorkCore_Platform -type f \( -name 'source-files.json' -o -iname '*source*manifest*.py' \) -print 2>/dev/null || true
            if [ -f app/extensions/WorkCore_Platform/tests/test_contract_source_manifest.py ]; then
              echo '===== TEST SOURCE ====='
              sed -n '1,260p' app/extensions/WorkCore_Platform/tests/test_contract_source_manifest.py
            fi
            while IFS= read -r manifest; do
              echo "===== MANIFEST: ${manifest} ====="
              sed -n '1,180p' "$manifest"
            done < <(find app/extensions/WorkCore_Platform -type f -name 'source-files.json' -print 2>/dev/null)
          }

          probe checkout
          php packages/titan-interaction-engine/tests/vertical_context.php
          probe vertical-context-test
          php packages/titan-interaction-engine/tests/run.php
          probe interaction-tests
          php packages/titan-interaction-engine/bin/verify.php
          probe interaction-verifier

          rm -rf /tmp/workcore-checksum-trace
          (
            cd app/extensions/WorkCore_Platform
            python tools/refresh_package_checksums.py --repo . --output-dir /tmp/workcore-checksum-trace
          )
          probe checksum-refresher

          echo '===== GENERATED CHECKSUM OUTPUT ====='
          find /tmp/workcore-checksum-trace -type f -maxdepth 2 -print | sort
          echo '===== GIT STATUS AFTER TRACE ====='
          git status --short
