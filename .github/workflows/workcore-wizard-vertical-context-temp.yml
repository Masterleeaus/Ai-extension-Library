name: WorkCore Wizard Vertical Context Temporary Verification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sqlite3
          coverage: none

      - name: Install isolated Illuminate test dependencies
        run: |
          mkdir -p /tmp/workcore-context-test
          cd /tmp/workcore-context-test
          printf '%s\n' '{"require":{"php":"^8.2","illuminate/database":"^10.0","illuminate/events":"^10.0"}}' > composer.json
          composer install --no-interaction --no-progress --prefer-dist

      - name: Run WorkCore wizard vertical context contract
        env:
          AI_EXTENSIONS_REPO_ROOT: ${{ github.workspace }}
          WORKCORE_TEST_VENDOR_AUTOLOAD: /tmp/workcore-context-test/vendor/autoload.php
        run: php app/extensions/WorkCore_Platform/tests/vertical_wizard_context.php

      - name: Run Interaction Engine context and regression suites
        run: |
          php packages/titan-interaction-engine/tests/vertical_context.php
          php packages/titan-interaction-engine/tests/run.php
          php packages/titan-interaction-engine/bin/verify.php

      - name: Run WorkCore Platform contract suite
        run: python -m unittest discover app/extensions/WorkCore_Platform/tests -p 'test_*.py' -v

      - name: Lint focused test and implementation
        run: |
          php -l app/extensions/WorkCore_Platform/tests/vertical_wizard_context.php
          php -l app/extensions/WorkCore_Platform/packages/workcore-business-network/src/Domains/WorkCore/System/Modules/Wizards/Services/WizardDefinitionRegistry.php
          php -l app/extensions/WorkCore_Platform/packages/workcore-business-network/src/Domains/WorkCore/System/Modules/Wizards/Providers/WorkWizardsServiceProvider.php
          find app/extensions/WorkCore_Platform/packages/workcore-business-network/src/Domains/WorkCore/System/Modules/Wizards \
            -name '*VerticalContext*.php' -print0 | xargs -0 -r -n1 php -l
