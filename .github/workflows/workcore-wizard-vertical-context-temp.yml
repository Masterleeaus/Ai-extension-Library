name: WorkCore Wizard Vertical Context Final Verification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/workcore-wizard-vertical-context
          fetch-depth: 0

      - name: Merge current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sqlite3
          coverage: none

      - name: Install isolated Illuminate test dependencies
        run: |
          rm -rf /tmp/workcore-context-test
          mkdir -p /tmp/workcore-context-test
          cd /tmp/workcore-context-test
          printf '%s\n' '{"require":{"php":"^8.2","illuminate/database":"^10.0","illuminate/events":"^10.0"}}' > composer.json
          composer install --no-interaction --no-progress --prefer-dist

      - name: Generate all canonical WorkCore integrity manifests
        working-directory: app/extensions/WorkCore_Platform
        run: |
          rm -rf /tmp/workcore-checksums
          python tools/refresh_package_checksums.py --repo . --output-dir /tmp/workcore-checksums
          cp /tmp/workcore-checksums/WorkCore.extension.manifest.json native-extensions/WorkCore/extension.manifest.json
          for generated in /tmp/workcore-checksums/*.files.sha256.json; do
            package="$(basename "$generated" .files.sha256.json)"
            cp "$generated" "packages/${package}/files.sha256.json"
          done
          actual="$(git -C ../../.. diff --name-only -- app/extensions/WorkCore_Platform/native-extensions/WorkCore/extension.manifest.json app/extensions/WorkCore_Platform/packages | sort)"
          expected="$(cat <<'EOF'
          app/extensions/WorkCore_Platform/native-extensions/WorkCore/extension.manifest.json
          app/extensions/WorkCore_Platform/packages/workcore-business-network/files.sha256.json
          app/extensions/WorkCore_Platform/packages/workcore-commercial/files.sha256.json
          app/extensions/WorkCore_Platform/packages/workcore-property-operations/files.sha256.json
          app/extensions/WorkCore_Platform/packages/workcore-shared-foundation/files.sha256.json
          app/extensions/WorkCore_Platform/packages/workcore-work-operations/files.sha256.json
          app/extensions/WorkCore_Platform/packages/workcore-workforce-assurance/files.sha256.json
          EOF
          )"
          test "$actual" = "$expected"

      - name: Run WorkCore wizard vertical context contract
        env:
          AI_EXTENSIONS_REPO_ROOT: ${{ github.workspace }}
          WORKCORE_TEST_VENDOR_AUTOLOAD: /tmp/workcore-context-test/vendor/autoload.php
        run: php app/extensions/WorkCore_Platform/tests/vertical_wizard_context.php

      - name: Run Interaction Engine context and regression suites
        run: |
          php packages/titan-interaction-engine/tests/vertical_context.php
          php packages/titan-interaction-engine/tests/run.php
          php packages/titan-interaction-engine/bin/verify.php

      - name: Run WorkCore Platform contract suite
        working-directory: app/extensions/WorkCore_Platform
        run: python -m unittest discover tests -p 'test_*.py' -v

      - name: Lint focused test and implementation
        run: |
          php -l app/extensions/WorkCore_Platform/tests/vertical_wizard_context.php
          php -l app/extensions/WorkCore_Platform/packages/workcore-business-network/src/Domains/WorkCore/System/Modules/Wizards/Services/WizardDefinitionRegistry.php
          php -l app/extensions/WorkCore_Platform/packages/workcore-business-network/src/Domains/WorkCore/System/Modules/Wizards/Providers/WorkWizardsServiceProvider.php
          find app/extensions/WorkCore_Platform/packages/workcore-business-network/src/Domains/WorkCore/System/Modules/Wizards \
            -name '*VerticalContext*.php' -print0 | xargs -0 -r -n1 php -l

      - name: Remove temporary workflows and validate production diff
        run: |
          rm -f .github/workflows/workcore-source-manifest-diagnostic-temp.yml
          rm -f .github/workflows/workcore-wizard-vertical-context-temp.yml
          git add -A
          git commit -m "feat(workcore): finalize wizard vertical context bridge [skip ci]"
          files="$(git diff --name-only origin/main...HEAD | sort)"
          printf '%s\n' "$files"
          test "$(printf '%s\n' "$files" | grep -c '^')" -eq 13
          ! printf '%s\n' "$files" | grep -q '^\.github/workflows/'
          git push origin HEAD:feature/workcore-wizard-vertical-context
