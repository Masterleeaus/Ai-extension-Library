openapi: 3.1.0
info:
  title: Titan Commerce Bookings API
  version: 1.0.0
  description: Seller-managed availability slots and signed-session customer reservations.
servers:
  - url: /api/v3/chatbot/ecommerce
paths:
  /{chatbot}/session/{sessionId}/bookings/availability:
    get:
      operationId: listAvailableBookingSlots
      summary: Find available appointment, service or event times
      parameters:
        - in: path
          name: chatbot
          required: true
          schema:
            type: string
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
        - in: query
          name: product_id
          schema:
            type: integer
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
      security:
        - CommerceSession: [bookings:read]
      responses:
        "200":
          description: Available seller booking slots
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/BookingSlot"
        "401":
          description: Signed commerce session is missing or invalid
  /{chatbot}/session/{sessionId}/bookings:
    post:
      operationId: reserveBookingSlot
      summary: Reserve available capacity after customer confirmation
      parameters:
        - in: path
          name: chatbot
          required: true
          schema:
            type: string
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            maxLength: 191
      security:
        - CommerceSession: [bookings:reserve]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slot_id]
              properties:
                slot_id:
                  type: integer
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 100
                customer_details:
                  type: object
                metadata:
                  type: object
      responses:
        "201":
          description: Booking confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Booking"
        "401":
          description: Signed commerce session is missing or invalid
        "422":
          description: Slot is unavailable or idempotency key conflicts
  /{chatbot}/session/{sessionId}/bookings/{booking}/cancel:
    post:
      operationId: cancelCustomerBooking
      summary: Cancel a booking owned by the current customer session
      parameters:
        - in: path
          name: chatbot
          required: true
          schema:
            type: string
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
        - in: path
          name: booking
          required: true
          schema:
            type: integer
      security:
        - CommerceSession: [bookings:reserve]
      responses:
        "200":
          description: Booking cancelled and capacity released
        "404":
          description: Booking is outside the chatbot or customer session
  /{chatbot}/bookings/slots:
    get:
      operationId: listSellerBookingSlots
      summary: List seller-managed availability
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Seller booking slots
    post:
      operationId: createSellerBookingSlot
      summary: Publish a bookable time slot from the seller's product line
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, starts_at, ends_at]
              properties:
                product_id:
                  type: integer
                variant_id:
                  type: integer
                title:
                  type: string
                description:
                  type: string
                starts_at:
                  type: string
                  format: date-time
                ends_at:
                  type: string
                  format: date-time
                timezone:
                  type: string
                capacity:
                  type: integer
                  minimum: 1
                  default: 1
                price_amount:
                  type: integer
                  description: Optional price in minor currency units
                currency:
                  type: string
                  minLength: 3
                  maxLength: 3
      responses:
        "201":
          description: Availability slot created
        "403":
          description: Authenticated user does not own the chatbot
  /{chatbot}/bookings:
    get:
      operationId: listSellerBookings
      summary: View the seller's bookings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Seller bookings
components:
  securitySchemes:
    CommerceSession:
      type: http
      scheme: bearer
      bearerFormat: CommerceSession
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    BookingSlot:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        product_id:
          type: integer
          nullable: true
        variant_id:
          type: integer
          nullable: true
        title:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        timezone:
          type: string
        capacity:
          type: integer
        available_capacity:
          type: integer
        price_amount:
          type: integer
          nullable: true
        currency:
          type: string
        status:
          type: string
          enum: [open, full, cancelled]
    Booking:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        slot:
          $ref: "#/components/schemas/BookingSlot"
        quantity:
          type: integer
        status:
          type: string
          enum: [confirmed, cancelled]
